name = "sharebox"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Serve the built PWA; only /api/* reaches the Worker code first.
[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Create with `wrangler d1 create sharebox`, then paste the id here.
[[d1_databases]]
binding = "DB"
database_name = "sharebox"
database_id = "9d3ba962-e9be-4ec5-89a9-04d2fafa3478"
migrations_dir = "migrations"

# Secrets (wrangler secret put): SHAREBOX_JWT_SECRET, GEMINI_API_KEY
